<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Admin Password</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            background: #0b0f1a;
            color: #e7eaf0;
        }

        .wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(460px, 100%);
            background: #111a2e;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 14px;
            padding: 18px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        p {
            margin: 0 0 14px;
            opacity: .8;
        }

        label {
            display: block;
            margin: 10px 0 6px;
            font-size: 13px;
            opacity: .9;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .15);
            background: #0b1224;
            color: #e7eaf0;
        }

        button {
            margin-top: 14px;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 0;
            background: #4c7dff;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        a {
            color: #9bb7ff;
            text-decoration: none;
            font-size: 13px;
        }

        .err {
            margin-top: 10px;
            color: #ff6b6b;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .muted {
            font-size: 12px;
            opacity: .75;
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <h1>Reset Admin Password</h1>
            <p>Use your old admin password or the temporary password printed in server console.</p>

            <form id="f">
                <label>Admin User ID or Email</label>
                <input id="adminId" required />

                <label>Old Password / Temp Password</label>
                <input id="oldOrTempPassword" type="password" required />

                <label>New Admin Password</label>
                <input id="newAdminPassword" type="password" required />

                <button type="submit">Set New Admin Password</button>

                <div class="muted" style="margin-top:10px;">
                    <a href="/admin-login.html">Back to Admin Login</a>
                </div>

                <div id="err" class="err"></div>
            </form>
        </div>
    </div>

    <script>
        const errEl = document.getElementById("err");

        const params = new URLSearchParams(location.search);
        const prefill = params.get("adminId");
        if (prefill) {
            document.getElementById("adminId").value = prefill;
        }


        document.getElementById("f").addEventListener("submit", async (e) => {
            e.preventDefault();
            errEl.textContent = "";

            const adminId = document.getElementById("adminId").value.trim();
            const oldOrTempPassword = document.getElementById("oldOrTempPassword").value;
            const newAdminPassword = document.getElementById("newAdminPassword").value;

            const r = await fetch("/api/auth/admin/reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ adminId, oldOrTempPassword, newAdminPassword })
            });

            const data = await r.json().catch(() => ({}));
            if (!r.ok) {
                errEl.textContent = data.error || "Reset failed";
                return;
            }

            location.href = "/admin.html";
        });
    </script>
</body>

</html>
